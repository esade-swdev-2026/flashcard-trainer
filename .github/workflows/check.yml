# Runs on every push and every pull request. The four checks below are exactly the
# commands in the README's "Develop" section — CI is not a different standard, it is
# the same one, run on a machine none of us owns. From module 4, when you start
# merging through pull requests, a red check blocks the merge.
name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Pinned to floating major tags so security patches arrive without edits.
      # Both run on node24: node20 actions emit a deprecation warning, and this is
      # the first green check sixty-two students will ever see. Note that
      # astral-sh/setup-uv stopped publishing floating major tags after v7 — the
      # newest exact release is v10.x, so moving past v7 means pinning a full
      # version and bumping it by hand.
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv (and Python 3.13)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest


      - name: Build the image
        run: docker build -t flashcard-trainer .

      - name: Run the image
        run: docker run --rm flashcard-trainer --help

      - name: Save and load a card in the image
        run: |
          docker run --rm -v ci-data:/app/data flashcard-trainer add-card "Capital of France?" "Paris"
          docker run --rm -v ci-data:/app/data flashcard-trainer list-cards | grep "Capital of France?"

  # Publishes the image to GHCR. Runs only after check is green, and only for a
  # push to main or a v* tag, never for a pull request.
  release:
    needs: check
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/esade-swdev-2026/flashcard-trainer

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and tag with the commit
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" .

      - name: Tag with the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker tag "$IMAGE:${GITHUB_SHA::7}" "$IMAGE:$GITHUB_REF_NAME"

      - name: Push the image
        run: docker push --all-tags "$IMAGE"

      - name: Pull it back and run it
        run: |
          TAG="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          docker image rm --force $(docker images "$IMAGE" -q | sort -u)
          docker pull "$IMAGE:$TAG"
          docker run --rm "$IMAGE:$TAG" --help
